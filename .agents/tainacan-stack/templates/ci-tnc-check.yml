name: tnc-check

on:
  pull_request:
  push:
    branches: [{{BRANCHES}}]

permissions:
  contents: read

jobs:
  tnc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none
      - name: tnc-check nas linhas alteradas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            git cat-file -e "$BASE" 2>/dev/null || BASE="HEAD~1"
          fi
          php .agents/tainacan-stack/bin/tnc-check --diff="$BASE" --format=github --fail-on=block
      - name: Conferências de release
        if: github.event_name == 'push'
        run: php .agents/tainacan-stack/bin/tnc-check --release --format=github --fail-on=block || true
